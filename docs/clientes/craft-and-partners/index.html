<style>
  /* Fontes do desenho, alojadas localmente: a página não faz pedidos externos. */
  @font-face{
    font-family:"Bebas Neue";
    src:url("fonts/bebas-neue-latin-400.woff2") format("woff2");
    font-weight:400; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:"Geologica";
    src:url("fonts/geologica-latin-var.woff2") format("woff2-variations"),
        url("fonts/geologica-latin-var.woff2") format("woff2");
    font-weight:300 500; font-style:normal; font-display:swap;
  }

  /* Tokens retirados do Figma (Craft and Partners, node 4:2). */
  :root{
    color-scheme: light;
    --green:#163f34;      /* verde-escuro dos títulos */
    --blue:#1f8ecd;       /* azul da marca, botões e arcos */
    --orange:#faa621;     /* laranja dos arcos e destaques */
    --body:#5a6561;       /* cinzento do texto corrido */
    --cream:#eee3d1;
    --paper:#fffdfa;

    --display:"Bebas Neue", "Arial Narrow", "Haettenschweiler", Impact, sans-serif;
    --text:"Geologica", "Helvetica Neue", Helvetica, Arial, sans-serif;

    --pad:clamp(24px, 4.5vw, 80px);
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }

  body{
    margin:0;
    min-height:100svh;
    background:var(--paper);
    background-image:linear-gradient(-55.73deg, var(--cream) 21.43%, var(--paper) 90.885%);
    background-attachment:fixed;
    color:var(--body);
    font-family:var(--text);
    font-weight:400;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }

  .page{
    flex:1;
    width:100%;
    max-width:1400px;
    margin-inline:auto;
    padding:var(--pad);
    display:flex;
    flex-direction:column;
    gap:clamp(32px, 5vw, 56px);
  }

  /* ---------- Logótipo ---------- */

  .masthead{ flex:none; }
  .logo{
    display:block;
    width:clamp(200px, 21vw, 288px);
    height:auto;
    color:var(--blue);
  }
  .logo path{ fill:currentColor; }

  /* ---------- Herói ---------- */

  .hero{
    flex:1;
    display:grid;
    grid-template-columns:1fr;
    gap:clamp(40px, 5vw, 72px);
    align-content:center;
    align-items:center;
  }

  @media (min-width:960px){
    .hero{ grid-template-columns:minmax(0,1fr) minmax(0,.85fr); }
  }

  .eyebrow{
    margin:0 0 14px;
    font-family:var(--display);
    font-size:clamp(18px, 1.6vw, 24px);
    line-height:1;
    letter-spacing:.38em;
    text-transform:uppercase;
    color:var(--green);
  }

  h1{
    margin:0;
    font-family:var(--display);
    font-weight:400;
    font-size:clamp(52px, 8vw, 116px);
    line-height:.92;
    letter-spacing:.005em;
    text-transform:uppercase;
    color:var(--green);
  }

  .lede{
    margin:clamp(20px, 2.4vw, 30px) 0 0;
    max-width:46ch;
    font-size:clamp(15px, 1.15vw, 17px);
    line-height:2;
    font-weight:300;
  }

  /* ---------- Botão (pílula azul do desenho) ---------- */

  .cta{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-top:clamp(26px, 3vw, 36px);
    padding:0 34px;
    min-height:55px;
    border-radius:999px;
    background:var(--blue);
    color:#fff;
    font-size:15px;
    font-weight:500;
    letter-spacing:.02em;
    text-decoration:none;
    transition:background-color .25s ease, transform .25s ease;
  }
  .cta:hover{ background:#1a7cb4; }
  .cta:active{ transform:translateY(1px); }
  .cta:focus-visible{ outline:3px solid var(--green); outline-offset:3px; }

  /* ---------- Contactos ---------- */

  .contacts{
    margin:clamp(36px, 4.4vw, 56px) 0 0;
    padding-top:clamp(24px, 2.8vw, 32px);
    border-top:1px solid rgba(22,63,52,.16);
    display:grid;
    gap:22px;
    grid-template-columns:1fr;
  }
  /* Só o email: uma coluna, alinhada com o resto da mancha. */

  .contacts dt{
    font-family:var(--display);
    font-size:15px;
    line-height:1;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--green);
  }
  .contacts dd{
    margin:10px 0 0;
    font-size:15px;
    line-height:1.5;
    overflow-wrap:anywhere;
  }
  .contacts a{
    color:var(--body);
    text-decoration:none;
    border-bottom:1px solid rgba(90,101,97,.35);
    padding-bottom:2px;
    transition:color .2s ease, border-color .2s ease;
  }
  .contacts a:hover{ color:var(--blue); border-bottom-color:var(--blue); }
  .contacts a:focus-visible{ outline:2px solid var(--blue); outline-offset:3px; border-radius:1px; }

  /* ---------- Orbe: disco azul + arcos do desenho ---------- */

  .orb{
    justify-self:center;
    width:min(100%, 560px);
    height:auto;
    display:block;
  }
  @media (max-width:959px){
    .orb{ width:min(58%, 268px); order:-1; }
    .hero{ gap:clamp(24px, 5vw, 40px); }
  }
  .orb .disc{ fill:var(--blue); }
  .orb .mono{ fill:var(--paper); }
  .orb .arc{
    fill:none;
    stroke-width:1.4;
    vector-effect:non-scaling-stroke;
  }

  /* ---------- Rodapé ---------- */

  .foot{
    flex:none;
    display:flex;
    flex-wrap:wrap;
    gap:8px 28px;
    padding-top:clamp(20px, 2.4vw, 28px);
    border-top:1px solid rgba(22,63,52,.16);
    font-family:var(--display);
    font-size:14px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:rgba(22,63,52,.62);
  }

  /* ---------- Movimento ---------- */

  .reveal{ opacity:0; transform:translateY(16px); animation:rise .9s cubic-bezier(.22,.61,.36,1) forwards; }
  .d1{ animation-delay:.08s; } .d2{ animation-delay:.18s; }
  .d3{ animation-delay:.28s; } .d4{ animation-delay:.38s; }
  @keyframes rise{ to{ opacity:1; transform:none; } }

  .orb-spin{ transform-origin:379.2px 351.5px; animation:spin 90s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media (prefers-reduced-motion:reduce){
    .reveal{ opacity:1; transform:none; animation:none; }
    .orb-spin{ animation:none; }
    .cta{ transition:none; }
  }
</style>
</head>

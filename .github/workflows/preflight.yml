# O mesmo que se corre em local antes de um push: typecheck, lint e build de
# produção. Serve de rede para o deploy — se isto passa, a Vercel não falha por
# causa do código.
name: preflight

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm run lint
      # O painel do Payload carrega os componentes pelo mapa de importações. Um
      # campo ou plugin novo sem o mapa regenerado responde 500 no /api do
      # painel — já aconteceu, com o upload direto para o Blob.
      - name: mapa de importações do painel está atualizado
        run: |
          npm run payload:importmap
          git diff --exit-code -- "src/app/(payload)/admin/importMap.js"
        env:
          DATABASE_URL: postgresql://ci@localhost:5432/ci
          PAYLOAD_SECRET: ci
          BLOB_READ_WRITE_TOKEN: vercel_blob_rw_ci_ci
      - run: npm run build

# A leitura em voz alta dos artigos que saíram esta semana.
#
# Corre de madrugada e apanha duas coisas: um artigo publicado nos últimos sete
# dias que ainda não foi lido, e qualquer artigo cujo corpo tenha mudado desde a
# gravação — a impressão digital do texto trata disso, e é ela que faz isto
# poder correr todos os dias sem pagar tudo outra vez.
#
# O `--desde=7` é o que impede a corrida de atacar o catálogo inteiro. Sem ele
# são trezentas e tal gravações e dois milhões e meio de caracteres, muito acima
# de uma quota mensal: em setembro de 2026 uma corrida sem limite esgotou a
# quota a meio de um artigo e deixou-o com português e sem inglês. O atraso de
# anos grava-se à mão, com `--limite`, ao ritmo que os créditos aguentam.
name: audio

on:
  schedule:
    # 04:00 UTC. Isto demora minutos por artigo e não tem pressa nenhuma.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      desde:
        description: "Janela em dias para artigos ainda por ler"
        default: "7"
      so:
        description: "Slug de um artigo, para ler só esse (ganha ao desde)"
        required: false

# Duas corridas ao mesmo tempo gravariam o mesmo artigo duas vezes e pagá-lo-iam
# duas vezes. Uma de cada vez, e a que chega depois espera — nunca se cancela
# uma a meio, que seriam créditos gastos e deitados fora.
#
# Publicar no painel dispara isto (ver `src/payload/hooks/audio.ts`), e quem
# publica carrega em guardar mais do que uma vez. As corridas a mais fazem fila
# e saem em segundos: a impressão digital do texto diz-lhes que não há nada
# novo para ler.
concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # O script junta os pedaços e mede a duração com o ffmpeg, e o runner do
      # GitHub não o traz — a primeira versão disto limitou-se a verificar que
      # existia, e a corrida morreu aqui sem chegar a ler nada. Instala-se, e só
      # quando falta: se um dia passar a vir na imagem, isto não faz nada.
      - name: ffmpeg
        run: |
          command -v ffmpeg > /dev/null && command -v ffprobe > /dev/null && exit 0
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      # Sem a chave não há nada a fazer, e um vermelho todas as noites é um
      # email todas as noites a dizer o mesmo. Sai limpo e diz porquê.
      - name: há chave?
        id: chave
        run: |
          if [ -z "${{ secrets.ELEVENLABS_API_KEY }}" ]; then
            echo "sem ELEVENLABS_API_KEY nos segredos do repositório: nada a fazer"
            echo "corre=nao" >> "$GITHUB_OUTPUT"
          else
            echo "corre=sim" >> "$GITHUB_OUTPUT"
          fi

      # O slug e a janela entram por ambiente e não na linha de comandos. Isto é
      # disparado pelo painel com um slug vindo da base de dados, e um valor de
      # fora interpolado dentro de um `run:` é uma porta aberta à injeção.
      - name: ler os artigos
        if: steps.chave.outputs.corre == 'sim'
        run: |
          if [ -n "$SO" ]; then
            npm run audio -- --so="$SO"
          else
            npm run audio -- --desde="${DESDE:-7}"
          fi
        env:
          SO: ${{ inputs.so }}
          DESDE: ${{ inputs.desde }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_PT: ${{ secrets.ELEVENLABS_VOICE_PT }}
          ELEVENLABS_VOICE_EN: ${{ secrets.ELEVENLABS_VOICE_EN }}
          # O Gemini está montado e desligado (ver `FORNECEDORES` no script).
          # A chave vai na mesma: sem ela, ligá-lo obrigava a mexer aqui também.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VOICE_PT: ${{ secrets.GEMINI_VOICE_PT }}
          # A purga fecha o ciclo: o áudio fica gravado, mas o leitor só aparece
          # na página quando o cache do Next souber que ele existe.
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          PURGE_URL: ${{ secrets.PURGE_URL }}
